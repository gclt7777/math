# ==================== Q4 配置（目标域自适应与部署）====================
io:
  source_feature_csv: "artifacts/q1/features_source.csv"
  target_feature_csv: "artifacts/q1/features_target.csv"
  q2_model_path: "artifacts/q2/best_model.joblib"
  q2_columns: "artifacts/q2/columns.json"
  q2_scaler: null
  out_dir: "artifacts/q4"
  log_file: "artifacts/q4/q4_adapt.log"
  raw_source_dirs:
    - "/Users/miyagiryota/Documents/数学建模/数据集/源域数据集"
  raw_target_dirs:
    - "/Users/miyagiryota/Documents/数学建模/数据集/目标域数据集"

data:
  label_col: "label"
  drop_cols: ["uid","domain","file_path","basename","fs_src","fs_target","segment_len","overlap","seg_idx","t0_sec","rpm_used"]
  prefer_z_features: true
  random_seed: 2025

adapt:
  feature_align: "zscore_to_source"
  self_training:
    enabled: true
    conf_threshold: 0.85
    max_iter: 3
    max_per_class: 9999
    min_new_samples: 20
    reweight_source: 1.0
    reweight_target: 1.0
  calibration:
    enabled: true
    method: "temperature"
  open_set:
    enabled: true
    reject_threshold: 0.5
    method: "max_proba"

report:
  figure_dpi: 160
  save_tables: true
  save_figures: true

export:
  save_adapter: true
  save_thresholds: true
# ==================== 结束 ====================
